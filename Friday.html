<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صل على النبي</title>
</head>

<body>

    <div class="card-container" onclick="this.classList.toggle('flipped')">
        <div class="card">
            <div class="card-front">
                
                <h1 class="desktop-text">اوني تشان مرر الماوس الان</h1>
                
                <h1 class="mobile-text">اوني تشان اضغط هنا الان</h1>
            </div>

            <div class="card-back">
                <h1>اللهم صل وسلم وبارك على نبينا محمد</h1>
                <p>إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا</p>
            </div>
        </div>
    </div>
         

    <style>
        
        * { 
            margin: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }

        body { 
            background: #f3ead8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-container {
            perspective: 1000px;
            width: 350px;
            height: 480px;
            cursor: pointer;
        }

        .card {
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
        }

        .card-container:hover .card,
        .card-container.flipped .card {
            transform: rotateY(180deg) translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

       .card-front {
        background: linear-gradient(135deg, #064213 0%, #000000 100%);
       }

       .card-front h1 {
        font-size: 28px;
        margin-bottom: 15px;
        letter-spacing: 5px;
        color: #f3ead8;
       }

       
       .mobile-text {
        display: none;
       }
       .desktop-text {
        display: block;
       }

       @media (max-width: 768px) {
           .desktop-text {
               display: none;
           }
           .mobile-text {
               display: block;
           }
       }

       .card-back {
        background: #f3ead8;
        color: #064213;
        transform: rotateY(180deg);
        border: 2px solid #064213;
       }

       .card-back h1 {
        font-size: 28px;
        margin-bottom: 15px;
        color: #064213;
       }

       .card-back p {
        font-size: 18px;
        line-height: 1.5;
        color: #064213;
       }

    </style>

    
</body>
</html>
